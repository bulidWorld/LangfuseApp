apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: langfuse
spec:
  selector:
    app: langfuse-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      containers:
        - name: web
          image: lingxi.image.io/kunpeng/lgfuse-app/langfuse-web:v0.005
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: WEB_PORT
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: langfuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      containers:
        - name: worker
          image: lingxi.image.io/kunpeng/lgfuse-app/langfuse-worker:v0.005
          ports:
            - name: http
              containerPort: 3030
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: langfuse-secrets
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: WORKER_PORT
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi

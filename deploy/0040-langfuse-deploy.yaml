apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: langfuse
spec:
  selector: {app: langfuse-web}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: langfuse
spec:
  replicas: 1
  selector:
    matchLabels: {app: langfuse-web}
  template:
    metadata:
      labels: {app: langfuse-web}
    spec:
      containers:
        - name: web
          image: lingxi.image.io/kunpeng/lgfuse-app/langfuse-web:v0.005
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: NODE_ENV, value: production}
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: PORT, value: "3000"}
            # Replace with the URL users use to open Langfuse.
            - {name: NEXTAUTH_URL, value: http://localhost:3000}
            - name: NEXTAUTH_SECRET
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: NEXTAUTH_SECRET}}
            - name: SALT
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: SALT}}
            - name: ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: ENCRYPTION_KEY}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: DATABASE_URL}}
            - name: CLICKHOUSE_MIGRATION_URL
              value: clickhouse://chi-clickhouse-installation-ck-db01-0-0.clickhouse.svc.cluster.local:9000
            - {name: CLICKHOUSE_URL, value: http://chi-clickhouse-installation-ck-db01-0-0.clickhouse.svc.cluster.local:8123}
            - {name: CLICKHOUSE_USER, value: langfuse-db}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: CLICKHOUSE_PASSWORD}}
            - {name: CLICKHOUSE_DB, value: langfuse}
            - {name: CLICKHOUSE_CLUSTER_ENABLED, value: "false"}
            - {name: REDIS_HOST, value: valkey.valkey.svc.cluster.local}
            - {name: REDIS_PORT, value: "6379"}
            - name: REDIS_AUTH
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: REDIS_PASSWORD}}
            - {name: REDIS_TLS_ENABLED, value: "false"}
            - {name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET, value: langfuse}
            - {name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT, value: http://seaweedfs.seaweedfs.svc.cluster.local:8333}
            - {name: LANGFUSE_S3_EVENT_UPLOAD_REGION, value: us-east-1}
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: SEAWEEDFS_S3_ACCESS_KEY}}
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: SEAWEEDFS_S3_SECRET_KEY}}
            - {name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE, value: "true"}
          readinessProbe:
            httpGet: {path: /api/public/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: langfuse
spec:
  replicas: 1
  selector:
    matchLabels: {app: langfuse-worker}
  template:
    metadata:
      labels: {app: langfuse-worker}
    spec:
      containers:
        - name: worker
          image: lingxi.image.io/kunpeng/lgfuse-app/langfuse-worker:v0.005
          ports:
            - {name: http, containerPort: 3030}
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3030"}
            # Keep this identical to NEXTAUTH_URL on the web container.
            - {name: NEXTAUTH_URL, value: http://localhost:3000}
            - name: NEXTAUTH_SECRET
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: NEXTAUTH_SECRET}}
            - name: SALT
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: SALT}}
            - name: ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: ENCRYPTION_KEY}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: POSTGRES_PASSWORD}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: DATABASE_URL}}
            - {name: CLICKHOUSE_MIGRATION_URL, value: clickhouse://chi-clickhouse-installation-ck-db01-0-0.clickhouse.svc.cluster.local:9000}
            - {name: CLICKHOUSE_URL, value: http://chi-clickhouse-installation-ck-db01-0-0.clickhouse.svc.cluster.local:8123}
            - {name: CLICKHOUSE_USER, value: langfuse-db}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: CLICKHOUSE_PASSWORD}}
            - {name: CLICKHOUSE_DB, value: langfuse}
            - {name: CLICKHOUSE_CLUSTER_ENABLED, value: "false"}
            - {name: REDIS_HOST, value: valkey.valkey.svc.cluster.local}
            - {name: REDIS_PORT, value: "6379"}
            - name: REDIS_AUTH
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: REDIS_PASSWORD}}
            - {name: REDIS_TLS_ENABLED, value: "false"}
            - {name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET, value: langfuse}
            - {name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT, value: http://seaweedfs.seaweedfs.svc.cluster.local:8333}
            - {name: LANGFUSE_S3_EVENT_UPLOAD_REGION, value: us-east-1}
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: SEAWEEDFS_S3_ACCESS_KEY}}
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: langfuse-secrets, key: SEAWEEDFS_S3_SECRET_KEY}}
            - {name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE, value: "true"}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 2Gi}
